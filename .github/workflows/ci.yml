name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck & Verification Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript
        run: bun x tsc --noEmit

      - name: Run IndiaCode Statutory Client Verification
        run: bun test/verify-indiacode.ts

      - name: Run Document Simplifier Verification
        run: bun test/verify-simplifier.ts
